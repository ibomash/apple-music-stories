[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "story-writer"
version = "0.1.0"
description = "Local-first Music Story writer API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "jsonschema>=4.25.0",
  "pydantic>=2.11.0",
  "pyyaml>=6.0.2",
  "uvicorn>=0.35.0",
]

[project.scripts]
story-writer-server = "story_writer.main:main"
story-writer-cli = "story_writer.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/story_writer"]
